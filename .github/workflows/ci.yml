name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  frontend:
    name: Frontend (app)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 与 Dockerfile 的运行时对齐（node:24-slim），CI 测一个线上不用的版本没意义
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      # 放最前面：格式不合规几秒就能判，不必等类型和测试跑完才红
      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # 放最前面：格式不合规几秒就能判，不必等测试跑完才红
      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Unit test
        run: npm test

      # 两个 job 都只跑本机已实测通过的门禁：
      #   app  typecheck 0 错 / lint 0 error 9 warning / build 通过

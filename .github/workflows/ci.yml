name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  frontend:
    name: Frontend (app)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 与 Dockerfile 的运行时对齐（node:24-slim），CI 测一个线上不用的版本没意义
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      # 放最前面：格式不合规几秒就能判，不必等类型和测试跑完才红
      - name: Format check
        run: npm run format:check

      # 依赖体检：npm audit 是 npm 自带的命令，不新增依赖，它只查你已有的依赖。
      # 11-02 起是**硬门**：两条 `lockfile 刷新`之后本机实测 `npm audit --audit-level=high` 在
      # backend 与 app 两侧都回 rc=0（改前是 backend 13 条含 1 critical＋4 high、app 23 条含 8 high，
      # 现在 high/critical 归零，只剩 8＋13 条 moderate＝minimatch 与 qs 那两族，够不到 high 阈值）。
      # 以后上游新爆一条 high 把 CI 跑红，那是**信号**不是故障：要么升版本，要么临时把
      # continue-on-error 加回来并在路线文档里记账，别默默删步骤。
      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # 前端行为测试（11-03 第二块大项开的第一条通道）：改前 `find app/src -name '*.test.*' -o
      # -name '*.spec.*'` 现量 **0 份**、`app/package.json` 里没有 test 脚本，前端只有
      # typecheck/lint/build 三道"能编译"的门 ⇒ 拆千行组件时没有任何回归防线。现在 vitest＋jsdom
      # 跑 `src/**/*.test.{ts,tsx}`：肤色取色数学、选图预检、依据档位、toast 去重、EvidenceTag 真渲染。
      # 跨语言的对账（前端那几份"明知故开的第二份常量"↔ 后端唯一实现处）不放这里，放
      # `backend/test/frontendConstantsParity.test.js`——前端 tsconfig 的 types 只有 vite/client，
      # 测试文件 import node:fs 会让上面的 Type check 红。
      - name: Unit test
        run: npm test

      - name: Build
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # 放最前面：格式不合规几秒就能判，不必等测试跑完才红
      - name: Format check
        run: npm run format:check

      # 依赖体检：同上，npm 自带命令、不新增依赖；11-02 起与 backend 一样是硬门（本机实测两侧 rc=0）
      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Unit test
        run: npm test

      # 接口说明书防漂移：docs/api/openapi.json 由 `backend/scripts/gen-openapi.js` 从
      # Express 自己的路由栈生成，⛔ 不手写第二份清单。这条 `--check` 重新生成一遍、
      # 与提交在仓库里的产物逐字节比对，不同就 rc=1 报 "OPENAPI DRIFT"。
      # 于是"改了路由没重生成说明书"这种最常见的腐烂，在 CI 这一步就红，而不是等
      # 接手的人照着过期的文档写前端。本机同一条命令实测 rc=0（见路线文档 §61）。
      - name: OpenAPI spec is up to date
        run: npm run openapi:check

      # 静态资产门禁（11-03 新增，第六道门）：`app/public`＋`backend/static`＋`backend/templates`
      # 这三处历史上不进任何门禁（prettier 只吃 `**/*.js`、eslint 只看 js），后台那几页 10-22 就栽过
      # ——CI 全绿、页面是坏的，只有真浏览器看得见。`scripts/check-web-assets.js` 把 17 份第一方资产
      # （html 基本盘：doctype/lang/charset/title；本地 src/href/action 能不能落到真文件或真路由；
      # robots 与 sitemap 口径；后台 js 语法过 vm 解析）钉成 rc=1 会红的门，名单自动扫、不用维护。
      - name: Web assets check
        run: npm run assets:check

      # 行号定位符体检（11-04 改进轮挂上）：**只报不拦**。`scripts/check-locators.js` 的退出码
      # 恒为 0 是它自己写死的设计（该文件第 22 行：「这是体检不是门禁；要让 CI 拦红请另加阈值判断，
      # 别默认打开」）。为什么这一轮不升成门：本机现量（11-04 同日第二轮；⏱ 自指数、谁用谁重跑）第一向「要动」548 条、第三向裸续号「要动」677 条，
      # 而脚本里已内置**判留名单**（`SNAPSHOT` 那条正则：`docs/复盘/`、`docs/进展报告/`、`docs/依据/`、`docs/superpowers/plans/`、`docs/形象设计模型-现状与路线.md`、文件名以 8 位日期结尾的 md），
      # 定稿复量待办只剩第一向 2 条／第三向 0 条（第三向那 3 条在同日收掉：期刊卷期页码与 README 端口两笔假账，见脚本末尾盲区⑤），逐条读过全是句中带"拆分前／当时写的"的历史号 ⇒ 按台账规矩只加限定、不改写，
      # 一当门禁就永久红，红到没人看等于没挂。**要看 trends 就读"按引用方拆"那两行的待办数，别读"要动"。**
      # 这一步真正的价值有两层：①"号在漂"每次 push 都进 Actions 的作业摘要，不必等谁在本地手动跑一遍；
      # ②脚本自己炸（git 不可用、索引面 glob 改坏、某份 md 变向读不出）时 node 退非 0 ⇒ 这步会红，
      #    那正是该拦的故障。**⛔ 别把它写成 `… | tee`**：管道尾巴会把退出码换成 tee 的 0，第 ② 层就没了。
      - name: Locator health (report only)
        run: |
          node scripts/check-locators.js > "$RUNNER_TEMP/locators.txt"
          cat "$RUNNER_TEMP/locators.txt"
          {
            echo '### 行号定位符体检（只报不拦，判据见 backend/scripts/check-locators.js）'
            echo ''
            echo '```'
            grep -E '^(\[定位符体检\] 扫描面| *第[一二三]向（| *(续号)?要动按引用方拆)' "$RUNNER_TEMP/locators.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 两个 job 都只跑本机已实测通过的门禁：
      #   app  typecheck 0 错 / lint 0 error 9 warning / build 通过
      #   backend  lint 0 error 121 warning / node --test 505 全过（10-14 现量，本仓 `test/*.test.js` 36 份。
      #          warning 逐条拆开：no-console 65／prefer-const 30／no-unused-vars 26（同一趟 eslint -f json 数的）。
      #          用例来路：452（10-13）→485＝routeIdParam20261014 那批把 19 处 id 截断改成 asId 后
      #          补的 33 条（28 个入口的"400＋整行快照没变"＋asId 单测＋正向对照＋0/负/空串＋两处闸扫）；
      #          485→505＝logicConsistency20261014.test.js 的 20 条（两层口径自相矛盾的六处修法各配断言，
      #          单独 `node --test` 跑这份也是 20/20）。新增这份文件后 warning 仍是 121，没涨。
      #          ⚠️ app 那 9 条 warning 的构成的确与 10-12 记的"全 react-refresh"不同：现量
      #          react-hooks/set-state-in-effect 5／react-refresh/only-export-components 3／exhaustive-deps 1，总数没变。
      #          121 比 10-13 那行的 124 少 3 条：no-console 与 10-12 基线（65）持平，少的是 no-unused-vars 27→26；
      #          那 3 条 console 具体是哪几行没的，我这轮没逐条追，不编原因。
      #          121 是把 logicFixes20261013.test.js 里那条没人开的 `eslint-disable no-new-func`
      #          撤掉后的数——它自己报 "Unused eslint-disable directive"，让全仓 warning 多算 1 条。
      #          "干净 checkout 复验"这句 10-11 之后没再跑过，本轮改完代码后按新提交重跑一遍）
      #   （2026-10-11 现量校正：这三处原先写的是 8 / 105 / 78，是第十八轮之前的旧数；
      #    第七~二十七轮陆续加测试与 no-console 警告，warning 与用例只涨不减；10-12 第二十七轮再重跑一遍＝122 warning／308 用例／app 9 warning、tsc 0 错、build 通过、两侧 format:check rc=0）
      #   （2026-10-22 第十四阶段·第一步收口现量，覆盖上面两行里过期的那四个数：backend lint **0 error／142 warning**

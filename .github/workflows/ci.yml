name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (app)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      # 快速失败：格式、类型和静态检查先于较慢的测试与构建。
      - name: Format check
        run: npm run format:check

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit test
        run: npm test

      - name: Build
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Format check
        run: npm run format:check

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      # server.js 的 staticCacheAndListExempt 真门禁要求 app/dist 在场；先构建前端，避免单测静默 skip。
      - name: Build frontend assets for backend gates
        run: |
          npm ci --no-audit --no-fund
          npm run build
        working-directory: app

      # 测试运行器从 schema 与种子创建临时 SQLite 库，不读取本机运行库。
      - name: Unit test
        run: npm test

      - name: OpenAPI spec is up to date
        run: npm run openapi:check

      - name: Web assets check
        run: npm run assets:check

      # 该脚本是体检报告，不是阈值门禁；保留步骤以发现脚本自身故障。
      - name: Locator health (report only)
        run: |
          node scripts/check-locators.js > "$RUNNER_TEMP/locators.txt"
          cat "$RUNNER_TEMP/locators.txt"
          {
            echo '### 行号定位符体检（只报不拦）'
            echo ''
            echo '```'
            grep -E '^(\[定位符体检\] 扫描面| *第[一二三]向（| *(续号)?要动按引用方拆)' "$RUNNER_TEMP/locators.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  windows:
    name: Windows clean install and tests
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies on Windows
        run: npm ci --no-audit --no-fund
        working-directory: app

      - name: Install backend dependencies on Windows
        # npm 会因 binding.gyp 自动尝试源码编译；使用包内预编译绑定，跳过 Python/node-gyp。
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: backend

      - name: Frontend Windows checks
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build
        working-directory: app

      # A clean install plus the real backend suite proves the bundled native
      # SQLite binding loads on Windows, without requiring Python or node-gyp.
      - name: Backend Windows tests
        run: npm test
        working-directory: backend

  docker-smoke:
    name: Docker Compose build and health smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SMOKE_ENV_FILE: ${{ runner.temp }}/styleai-smoke.env
      SMOKE_OVERRIDE_FILE: ${{ runner.temp }}/styleai-smoke.compose.yml

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Prepare isolated Compose environment
        run: |
          set -euo pipefail
          umask 077
          port=$(node -e "const s=require('net').createServer();s.listen(0,'127.0.0.1',()=>{console.log(s.address().port);s.close()})")
          {
            printf 'COMPOSE_PROJECT_NAME=styleai-smoke-%s-%s\n' "$RANDOM" "$$"
            printf 'SMOKE_PORT=%s\n' "$port"
            printf 'SMOKE_SECRET_KEY=%s\n' "$(openssl rand -hex 32)"
            printf 'SMOKE_ADMIN_PASSWORD=%s\n' "$(openssl rand -base64 24)"
          } > "$SMOKE_ENV_FILE"
          cat > "$SMOKE_OVERRIDE_FILE" <<'YAML'
          services:
            app:
              env_file: !reset []
              environment:
                NODE_ENV: production
                SECRET_KEY: ${SMOKE_SECRET_KEY}
                ADMIN_PASSWORD: ${SMOKE_ADMIN_PASSWORD}
                DASHSCOPE_API_KEY: ""
                LLM_API_BASE: ""
                LLM_API_KEY: ""
                LLM_MODEL: ""
                WXPAY_MCHID: ""
                WXPAY_SERIAL_NO: ""
                WXPAY_APIV3_KEY: ""
                WXPAY_PUBLIC_KEY_ID: ""
                WXPAY_PRIVATE_KEY_PATH: ""
                WXPAY_PUBLIC_KEY_PATH: ""
                WXPAY_NOTIFY_URL: ""
                WXPAY_APPID: ""
                ALIPAY_APP_ID: ""
                ALIPAY_PRIVATE_KEY_PATH: ""
                ALIPAY_PUBLIC_KEY_PATH: ""
                ALIPAY_NOTIFY_URL: ""
                ALIPAY_RETURN_URL: ""
                ALIPAY_SELLER_ID: ""
              ports:
                - "127.0.0.1:${SMOKE_PORT}:5000"
          YAML
          set -a
          . "$SMOKE_ENV_FILE"
          set +a
          # --env-file 阻止 Compose 读取仓库 .env；override 的 !reset 也移除服务的 env_file。
          docker compose --env-file "$SMOKE_ENV_FILE" -f compose.yaml -f "$SMOKE_OVERRIDE_FILE" config --quiet

      - name: Build and start isolated Compose stack
        run: |
          set -euo pipefail
          set -a
          . "$SMOKE_ENV_FILE"
          set +a
          docker compose --env-file "$SMOKE_ENV_FILE" -f compose.yaml -f "$SMOKE_OVERRIDE_FILE" up -d --build --wait --wait-timeout 90
          curl --fail --silent --show-error "http://127.0.0.1:${SMOKE_PORT}/health"
          curl --fail --silent --show-error "http://127.0.0.1:${SMOKE_PORT}/api/models/list" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const b=JSON.parse(s);const a=Array.isArray(b)?b:(b.models||b.data||[]);if(!Array.isArray(a)||a.length!==0)process.exit(1);console.log('empty model catalog: ok')})"
          docker compose --env-file "$SMOKE_ENV_FILE" -f compose.yaml -f "$SMOKE_OVERRIDE_FILE" exec -T app node -e "(async()=>{const fs=require('fs');if(process.env.STYLEAI_DB_PATH!=='/data/db/styleai.db'||process.env.STYLEAI_UPLOAD_DIR!=='/data/uploads')process.exit(1);if(!fs.statSync('/data/db').isDirectory()||!fs.statSync('/data/uploads').isDirectory())process.exit(1);if(fs.readdirSync('/models').length!==0)process.exit(1);const r=await fetch('http://127.0.0.1:5000/api/models/list');if(!r.ok)process.exit(1)})()"
          for volume in db_data upload_data model_data; do
            docker volume inspect "${COMPOSE_PROJECT_NAME}_${volume}" >/dev/null
          done
          # /app 来自镜像层（没有卷覆盖）：只检查文件名，不读取任何数据库内容。
          docker compose --env-file "$SMOKE_ENV_FILE" -f compose.yaml -f "$SMOKE_OVERRIDE_FILE" exec -T app sh -c '
            test ! -e /app/runtime-db &&
            test -f /app/db/styleai.db &&
            test -z "$(find /app -type f \( -name "*.db-wal" -o -name "*.db-shm" \) -print -quit)"
          '

      - name: Show Compose logs on failure
        if: failure()
        run: |
          set -a
          . "$SMOKE_ENV_FILE"
          set +a
          docker compose --env-file "$SMOKE_ENV_FILE" -f compose.yaml -f "$SMOKE_OVERRIDE_FILE" logs --no-color || true

      - name: Remove isolated Compose stack and volumes
        if: always()
        run: |
          if [ ! -f "$SMOKE_ENV_FILE" ] || [ ! -f "$SMOKE_OVERRIDE_FILE" ]; then
            rm -f "$SMOKE_ENV_FILE" "$SMOKE_OVERRIDE_FILE"
            exit 0
          fi
          set -a
          . "$SMOKE_ENV_FILE"
          set +a
          docker compose --env-file "$SMOKE_ENV_FILE" -f compose.yaml -f "$SMOKE_OVERRIDE_FILE" down -v --remove-orphans || true
          rm -f "$SMOKE_ENV_FILE" "$SMOKE_OVERRIDE_FILE"

  playwright:
    name: Playwright browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/app/.tmp/playwright-browsers
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        run: |
          npm ci --no-audit --no-fund
          rm -rf node_modules/@playwright/test node_modules/playwright node_modules/playwright-core

      - name: Install backend dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: backend

      - name: Build real frontend assets
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Install project-local Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright teardown regression
        run: node --test ../scripts/playwright-cleanup.test.cjs

      # 根配置从 schema/种子创建临时空模型库，并使用明显的测试凭据。
      - name: Run browser smoke
        run: npm run test:e2e

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-diagnostics
          path: |
            .tmp/playwright-report/
            .tmp/playwright-results/
          if-no-files-found: ignore
          retention-days: 7

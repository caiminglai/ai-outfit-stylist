      #    app lint **0 error／13 warning**（set-state-in-effect 8／only-export-components 4／exhaustive-deps 1）。
      #    ⓵ eslint 两侧都只卡 error，warning 不会把 CI 跑红；⓶ 上面 10-14 那几行是当时的真实读数，留档不改写。）
      #   （2026-10-22 18:5x 追加·后台「编程水平与独立路线」页现量，覆盖上一行的用例数与份数：`node --test` **800 pass／0 fail**、
      #    `test/*.test.js` **55** 份（新增的 5 条全在 `adminSkillPage.test.js`）；backend lint 仍 **0 error／142 warning**、app 仍 **0 error／13 warning**，两侧 `format:check` rc=0。
      #    ⚠️ 这一页本身（`static/admin/admin-skill.js`＋`templates/admin.html`＋`admin.css`）**不在 CI 的射程内**——`.prettierignore` 与 `eslint.config.js` 都把 `static/` 和 `templates/` 整目录排除，

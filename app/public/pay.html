<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>付款与凭证提交 — 私人形象定制AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #12141a; color: #e8eaf0; min-height: 100vh; padding: 20px 16px 60px; }
    .wrap { max-width: 520px; margin: 0 auto; }
    h1 { font-size: 20px; margin-bottom: 6px; }
    .sub { color: #8b93a7; font-size: 13px; line-height: 1.6; margin-bottom: 20px; }
    .card { background: #1b1f28; border: 1px solid #2a3040; border-radius: 12px; padding: 18px; margin-bottom: 16px; }
    .price { font-size: 30px; font-weight: 700; color: #ffd479; }
    .price small { font-size: 14px; color: #8b93a7; font-weight: 400; margin-left: 6px; }
    .tabs { display: flex; gap: 8px; margin: 16px 0 12px; }
    .tab { flex: 1; padding: 10px; text-align: center; border-radius: 8px; border: 1px solid #2a3040; background: #14171f; color: #a8b0c2; font-size: 14px; cursor: pointer; }
    .tab.on { background: #24304a; border-color: #3d5a8a; color: #dbe6f8; }
    .qr { display: none; text-align: center; }
    .qr.on { display: block; }
    .qr img { width: 240px; max-width: 80%; border-radius: 10px; background: #fff; padding: 8px; }
    .qr p { font-size: 12px; color: #8b93a7; margin-top: 8px; }
    label { display: block; font-size: 13px; color: #a8b0c2; margin: 14px 0 6px; }
    input[type=file] { width: 100%; font-size: 13px; color: #a8b0c2; }
    button.act { width: 100%; margin-top: 14px; padding: 12px; border: 0; border-radius: 8px; background: #ffd479; color: #2a220a; font-size: 15px; font-weight: 600; cursor: pointer; }
    button.act:disabled { opacity: .5; cursor: not-allowed; }
    .row { display: flex; align-items: center; justify-content: space-between; font-size: 13px; padding: 7px 0; border-bottom: 1px solid #242a37; }
    .row:last-child { border-bottom: 0; }
    .row span:first-child { color: #8b93a7; }
    .badge { padding: 2px 9px; border-radius: 20px; font-size: 12px; }
    .b-pending { background: #3a3218; color: #ffd479; }
    .b-approved { background: #1c3526; color: #7ddba3; }
    .b-rejected { background: #3a1f22; color: #ff9ba1; }
    .msg { font-size: 13px; margin-top: 10px; min-height: 18px; }
    .msg.err { color: #ff9ba1; }
    .msg.ok { color: #7ddba3; }
    .note { font-size: 12px; color: #6f7789; line-height: 1.7; }
    .alt { font-size: 12px; color: #8ab4f8; margin-top: 8px; cursor: pointer; }
    a { color: #8ab4f8; }
  </style>
</head>
<body>
<div class="wrap">
  <h1>付款与凭证提交</h1>
  <p class="sub">点「一键付款」在线支付，付完本页会自动确认到账并放行服务。备用收款码默认收起，需要扫码转账时点「显示备用收款码」，再上传付款截图由我们人工确认。</p>

  <div class="card">
    <div class="price" id="price">—<small id="price-title"></small></div>
    <div class="tabs">
      <div class="tab on" data-ch="wechat">微信支付</div>
      <div class="tab" data-ch="alipay">支付宝</div>
    </div>
    <div class="qr on" id="qr-wechat">
      <button class="act" id="wechat-pay" style="display:none">微信扫码付款</button>
      <div class="msg" id="wechat-msg"></div>
      <div id="wechat-qr"></div>
      <div id="wechat-fallback"><img alt="微信收款码" src="/wechat-qr.png"><p>扫这个码付款，付完需在下面上传付款截图，我们人工核对后放行服务</p></div>
      <p class="alt" id="wechat-alt" style="display:none">显示备用收款码</p>
    </div>
    <div class="qr" id="qr-alipay">
      <button class="act" id="alipay-pay" style="display:none">支付宝一键付款</button>
      <div class="msg" id="alipay-msg"></div>
      <div id="alipay-fallback"><img alt="支付宝收款码" src="/alipay-qr.png"><p>扫这个码付款，付完需在下面上传付款截图，我们人工核对后放行服务</p></div>
      <p class="alt" id="alipay-alt" style="display:none">显示备用收款码</p>
    </div>
  </div>

  <div class="card">
    <label for="proof">付款截图（jpg / png / webp，10MB 以内）</label>
    <input type="file" id="proof" accept="image/jpeg,image/png,image/webp">
    <button class="act" id="submit">提交凭证</button>
    <div class="msg" id="msg"></div>
  </div>

  <div class="card">
    <div class="row"><span>当前状态</span><span id="my-status">未提交</span></div>
    <div class="row"><span>金额</span><span id="my-amount">—</span></div>
    <div class="row"><span>提交时间</span><span id="my-time">—</span></div>
    <div class="row"><span>备注</span><span id="my-note">—</span></div>
  </div>

  <p class="note">两枚按钮都走商户号，付完本页自动确认到账。如果点了按钮没出现付款页，说明这一路收款还没开通——点上面的「显示备用收款码」扫码转账，再用下面的「提交凭证」由我们人工确认。</p>
  <p class="note"><a href="/">返回展厅</a></p>
</div>

<script src="/qrcode.js"></script>
<script>
/* 游客身份单独存一份，不和展厅 SPA 共用 key：
   SPA 那边写进 localStorage 的 id 是浏览器自己拼的，服务端没有登记，
   混用会让本页提交凭证时被 loginRequired 挡成 401。
   服务端 users 表里的游客记录不会过期，所以这里也不按时间淘汰身份。 */
var SID_KEY = 'style_ai_guest', TS_KEY = 'style_ai_guest_ts';

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

async function ensureSession(force) {
  var sid = localStorage.getItem(SID_KEY);
  if (sid && !force) return sid;
  var res = await fetch('/api/auth/guest', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({}),
  });
  var data = await res.json();
  if (!data.success) throw new Error('游客身份注册失败');
  sid = data.data.session_id;
  localStorage.setItem(SID_KEY, sid);
  localStorage.setItem(TS_KEY, String(Date.now()));
  return sid;
}

async function api(path, opts) {
  opts = opts || {};
  opts.headers = opts.headers || {};
  opts.headers['X-Session-Id'] = await ensureSession();
  var res = await fetch(path, opts);
  if (res.status === 401) {
    opts.headers['X-Session-Id'] = await ensureSession(true);
    res = await fetch(path, opts);
  }
  return res.json();
}

function setMsg(text, cls) {
  var el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg' + (cls ? ' ' + cls : '');
}

function showMine(row) {
  if (!row) return;
  var map = { pending: ['待确认', 'b-pending'], approved: ['已确认', 'b-approved'], rejected: ['未通过', 'b-rejected'] };
  var st = map[row.status] || [row.status, 'b-pending'];
  document.getElementById('my-status').innerHTML = '<span class="badge ' + st[1] + '">' + esc(st[0]) + '</span>';
  document.getElementById('my-amount').textContent = '¥' + Number(row.amount).toFixed(2);
  document.getElementById('my-time').textContent = row.created_at || '—';
  document.getElementById('my-note').textContent = row.admin_note || '—';
}

/* 在线付款：后端把密钥配齐才通电（cfg.alipay_web / cfg.wechat_native）。
   没通电时这两枚按钮一直 display:none，本页行为跟接商户号之前一字不差。 */
var CHANNELS = {
  alipay: { orderEp: '/api/payment/alipay/order', urlKey: 'pay_url', again: '重新打开支付宝付款页' },
  wechat: { orderEp: '/api/payment/order', urlKey: 'code_url', again: '重新显示微信收款码' },
};
var orders = { alipay: { no: '', url: '', timer: null, tries: 0 }, wechat: { no: '', url: '', timer: null, tries: 0 } };

function setOnlineMsg(ch, html, cls) {
  var el = document.getElementById(ch + '-msg');
  el.innerHTML = html;
  el.className = 'msg' + (cls ? ' ' + cls : '');
}

function stopPoll(ch) {
  var o = orders[ch];
  if (o.timer) {
    clearInterval(o.timer);
    o.timer = null;
  }
}

/* 支付宝跳收银台，微信在本页出码；重复点按钮都回到同一笔订单，不再建第二单 */
function showPayPage(ch) {
  var o = orders[ch];
  if (ch === 'wechat') {
    drawWxQr(o.url);
    setOnlineMsg(ch, '用微信「扫一扫」扫上面的码付款，付完这页会自动确认到账。');
    return;
  }
  var win = window.open(o.url, '_blank');
  setOnlineMsg(
    ch,
    win
      ? '已在新窗口打开支付宝收银台，付完这页会自动确认到账。'
      : '浏览器拦住了新窗口，请手动点：<a href="' + esc(o.url) + '" target="_blank" rel="noopener">打开支付宝付款</a>',
  );
}

/* 查单接口内部会再向渠道兜底问一次，所以回调万一丢了也不影响这里确认到账 */
function pollOrder(ch) {
  var o = orders[ch];
  if (o.timer) return;
  o.timer = setInterval(async function () {
    if (!o.no) return;
    if (++o.tries > 60) {
      stopPoll(ch);
      setOnlineMsg(ch, '还没查到到账。确实付成功的话，稍后刷新本页即可；也可以先用下面的「提交凭证」。');
      return;
    }
    try {
      var d = await api('/api/payment/order/' + encodeURIComponent(o.no));
      if (d.success && d.data.status === 'paid') {
        stopPoll(ch);
        setOnlineMsg(ch, '已到账 ¥' + esc(Number(d.data.amount).toFixed(2)) + '，服务已放行。', 'ok');
        await loadMine();
      }
    } catch (e) {
      /* 查单偶发失败就下一轮再试，别把按钮和提示打断 */
    }
  }, 3000);
}

/* code_url 是纯 ASCII（weixin://wxpay/bizpayurl?pr=xxx），用 vendor 进来的 qrcode-generator 现场画 */
function drawWxQr(codeUrl) {
  var qr = qrcode(0, 'M');
  qr.addData(codeUrl);
  qr.make();
  // 只传 cellSize：第二参是像素边距，缺省 cellSize*4 才够二维码标准要求的 4 模块静区
  document.getElementById('wechat-qr').innerHTML =
    '<img alt="微信支付二维码" src="' + qr.createDataURL(8) + '"><p>这是商户号收款码，扫一扫即可付款</p>';
  document.getElementById('wechat-fallback').style.display = 'none';
}

function bindPayButton(ch) {
  document.getElementById(ch + '-pay').addEventListener('click', async function () {
    var btn = this;
    var o = orders[ch];
    if (o.url) {
      showPayPage(ch);
      return;
    }
    btn.disabled = true;
    setOnlineMsg(ch, '正在创建订单…');
    try {
      var d = await api(CHANNELS[ch].orderEp, { method: 'POST' });
      if (!d.success) throw new Error((d.error && d.error.message) || '下单失败');
      o.no = d.data.out_trade_no;
      o.url = d.data[CHANNELS[ch].urlKey];
      btn.textContent = CHANNELS[ch].again;
      showPayPage(ch);
      pollOrder(ch);
    } catch (e) {
      setOnlineMsg(ch, esc(e.message || '下单失败'), 'err');
    } finally {
      btn.disabled = false;
    }
  });
}

function revealPay(ch, label, amount) {
  var btn = document.getElementById(ch + '-pay');
  btn.textContent = label + ' ¥' + Number(amount).toFixed(2);
  btn.style.display = 'block';
  // 在线路通电了就把个人收款码收起，免得同屏两张码让人不知道该扫哪个
  document.getElementById(ch + '-fallback').style.display = 'none';
  document.getElementById(ch + '-alt').style.display = 'block';
}

['wechat', 'alipay'].forEach(function (ch) {
  document.getElementById(ch + '-alt').addEventListener('click', function () {
    document.getElementById(ch + '-fallback').style.display = 'block';
    this.style.display = 'none';
  });
});

bindPayButton('alipay');
bindPayButton('wechat');

function activateTab(ch) {
  document.querySelectorAll('.tab').forEach(function (t) {
    t.classList.toggle('on', t.dataset.ch === ch);
  });
  document.querySelectorAll('.qr').forEach(function (q) {
    q.classList.toggle('on', q.id === 'qr-' + ch);
  });
}

document.querySelectorAll('.tab').forEach(function (tab) {
  tab.addEventListener('click', function () {
    activateTab(tab.dataset.ch);
  });
});

document.getElementById('submit').addEventListener('click', async function () {
  var btn = this;
  var file = document.getElementById('proof').files[0];
  if (!file) return setMsg('请先选择付款截图', 'err');
  // 与后端 middleware/upload.js 同一条上限（multer memoryStorage 10MB）：本机先挡住，
  // 免得整张手机截图传上去才换一句 400。accept 已经限了 jpeg/png/webp，这里只补体积。
  if (file.size > 10 * 1024 * 1024) return setMsg('截图超过 10 MB，请压缩后再传', 'err');
  btn.disabled = true;
  setMsg('上传中…');
  try {
    var fd = new FormData();
    fd.append('file', file);
    fd.append('channel', document.querySelector('.tab.on').dataset.ch);
    var data = await api('/api/payment/deposit', { method: 'POST', body: fd });
    if (!data.success) throw new Error((data.error && data.error.message) || data.message || '提交失败');
    setMsg('已提交，等待人工确认（编号 ' + data.data.id + '）', 'ok');
    document.getElementById('proof').value = '';
    await loadMine();
  } catch (e) {
    setMsg(e.message || '提交失败', 'err');
  } finally {
    btn.disabled = false;
  }
});

async function loadMine() {
  try {
    var data = await api('/api/payment/my');
    if (data.success && data.data) showMine(data.data);
  } catch (e) { /* 首访无凭证，忽略 */ }
}

(async function init() {
  try {
    var cfg = await (await fetch('/api/payment/qrcodes')).json();
    if (cfg.success) {
      document.getElementById('price').firstChild.nodeValue = '¥' + Number(cfg.data.amount).toFixed(2);
      document.getElementById('price-title').textContent = cfg.data.title;
      if (cfg.data.alipay_web) revealPay('alipay', '支付宝一键付款', cfg.data.amount);
      if (cfg.data.wechat_native) revealPay('wechat', '微信扫码付款', cfg.data.amount);
      // 默认停在真正能付的那一档，别让访客一进来就落在没开通的渠道上
      var live = cfg.data.wechat_native ? 'wechat' : cfg.data.alipay_web ? 'alipay' : '';
      if (live) activateTab(live);
    }
    await loadMine();
  } catch (e) {
    setMsg('页面初始化失败：' + e.message, 'err');
  }
})();
</script>
</body>
</html>

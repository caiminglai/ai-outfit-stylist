services:
  app:
    build: .
    # Copy .env.example to .env and replace the two explicit demo credentials
    # before the first start. Missing/blank values still fail the server's
    # production secret gate; Compose does not inject fallback secrets.
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 5000
      HOST: 0.0.0.0
      SECRET_KEY: ${SECRET_KEY:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      STYLEAI_DB_PATH: /data/db/styleai.db
      STYLEAI_UPLOAD_DIR: /data/uploads
    ports:
      - "127.0.0.1:${PORT:-5000}:5000"
    volumes:
      - db_data:/data/db
      - upload_data:/data/uploads
      # Seeded once from /models in the image, then read-only. Host models and
      # host runtime databases are never bind-mounted into the container.
      - model_data:/models:ro
    restart: unless-stopped

volumes:
  db_data:
  upload_data:
  model_data:
